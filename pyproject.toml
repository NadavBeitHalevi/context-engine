[project]
name = "context-engine"
version = "0.1.0"
description = "FastAPI service that runs a multi-agent Context Engine (Planner -> Executor -> Agents) to produce output for a user's goal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.2",
    "openai>=3.46.0",
    "pinecone>=10.3.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: calls real external APIs with keys from .env (run with: uv run pytest -m integration)",
]
